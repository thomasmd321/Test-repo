name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every script here mocks out network/subprocess calls in its tests
        # (aside from a few tests that talk to a real loopback socket this
        # same job spins up), so this needs nothing beyond the stdlib +
        # pytest - no scapy/psutil, no real network access, no elevated
        # privileges.
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile-check every script
        run: python -m py_compile network_scanner.py mobile_network_scanner.py scan_diff.py mdns_browser.py wifi_scanner.py exposure_check.py traceroute_mapper.py arp_monitor.py lan_throughput.py upnp_audit.py dhcp_monitor.py dns_check.py network_dashboard.py win_arp_dhcp_watch.py

      - name: Run tests
        run: pytest -v
